name: Terraform CI

on:
  push:
    branches: [ "dev", "staging" ]
  pull_request:
    branches: [ "prod" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Lint
        run: |
          tflint --init
          tflint
      
      - name: Terraform Init & Plan
        run: |
          cd dev
          terraform init
          terraform plan
      
      # Optionally, auto-approve only for dev/staging, manual for prod
      - name: Terraform Apply
        if: github.ref == 'refs/heads/dev'
        run: |
          cd dev
          terraform apply -auto-approve
