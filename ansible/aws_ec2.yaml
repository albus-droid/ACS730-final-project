plugin: aws_ec2
regions:
    - us-east-1
filters:
    "tag:Environment": "staging"
      # Optionally, if you want only webservers (if you have a tag "Role=Webserver")
      #   # "tag:Role": "Webserver"
keyed_groups:
    - key: tags.Name
      prefix: ""
compose:
      ansible_host: public_ip_address
      
